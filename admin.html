<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 대화 로그 — 어드민</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, 'Pretendard', sans-serif; }
  body { background: #0f0f11; color: #e2e8f0; min-height: 100vh; padding: 28px 24px; }
  h1 { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #64748b; margin-bottom: 24px; }

  .login-box { max-width: 380px; margin: 80px auto; background: #1a1a1f; border: 1px solid #2a2a35; border-radius: 16px; padding: 32px; }
  .login-box h2 { font-size: 16px; font-weight: 700; color: #f1f5f9; margin-bottom: 20px; }
  .login-box input { width: 100%; background: #111118; border: 1px solid #2a2a35; border-radius: 8px; color: #f1f5f9; font-size: 13px; padding: 10px 14px; margin-bottom: 12px; outline: none; }
  .login-box input:focus { border-color: #6366f1; }
  .login-box button { width: 100%; background: #6366f1; border: none; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 600; padding: 10px; cursor: pointer; }
  .login-box button:hover { background: #4f46e5; }

  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .toolbar input[type=text] { flex: 1; min-width: 200px; background: #1a1a1f; border: 1px solid #2a2a35; border-radius: 8px; color: #f1f5f9; font-size: 13px; padding: 8px 12px; outline: none; }
  .toolbar input[type=text]:focus { border-color: #6366f1; }
  .stat { font-size: 12px; color: #64748b; }
  .stat b { color: #a78bfa; }

  .btn { background: #1e1e28; border: 1px solid #2a2a35; border-radius: 8px; color: #94a3b8; font-size: 12px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: #6366f1; color: #a78bfa; }
  .btn-del { border-color: #450a0a; color: #f87171; }
  .btn-del:hover { border-color: #dc2626; color: #f87171; background: #1c0a0a; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: #475569; font-weight: 600; padding: 8px 12px; border-bottom: 1px solid #1e1e28; position: sticky; top: 0; background: #0f0f11; }
  td { padding: 10px 12px; border-bottom: 1px solid #181820; vertical-align: top; }
  tr:hover td { background: #14141c; }
  .t-num { color: #475569; width: 44px; }
  .t-time { color: #64748b; width: 148px; white-space: nowrap; }
  .t-q { color: #e2e8f0; line-height: 1.5; }
  .t-model { color: #6366f1; width: 140px; font-size: 11px; }
  .t-len { color: #475569; width: 60px; text-align: right; }

  .pagination { display: flex; align-items: center; gap: 8px; margin-top: 20px; justify-content: center; }
  .pagination .btn { padding: 6px 12px; }
  .pagination .cur { color: #a78bfa; font-size: 12px; }

  .empty { text-align: center; padding: 60px 0; color: #334155; font-size: 13px; }
  .err { background: #1c0a0a; border: 1px solid #450a0a; border-radius: 8px; padding: 12px 16px; color: #f87171; font-size: 13px; margin-bottom: 16px; }

  #main { display: none; }
</style>
</head>
<body>

<!-- 로그인 폼 -->
<div class="login-box" id="loginBox">
  <h2>🔒 어드민 로그인</h2>
  <input type="password" id="keyInput" placeholder="ADMIN_SECRET 입력" autocomplete="off">
  <button onclick="doLogin()">확인</button>
  <div id="loginErr" style="color:#f87171;font-size:12px;margin-top:10px;display:none">키가 올바르지 않습니다.</div>
</div>

<!-- 로그 뷰어 -->
<div id="main">
  <h1>AI 대화 로그</h1>
  <div class="sub" id="subTitle">Creative Dashboard — AI 챗봇 사용 기록</div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="질문 내용 검색..." oninput="debSearch()">
    <span class="stat" id="statEl"></span>
    <button class="btn" onclick="loadPage(currentPage - 1)">◀ 이전</button>
    <button class="btn" onclick="loadPage(currentPage + 1)">다음 ▶</button>
    <button class="btn btn-del" onclick="clearLogs()">전체 삭제</button>
  </div>
  <div id="errBox"></div>
  <div style="overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th class="t-num">#</th>
          <th class="t-time">시각</th>
          <th class="t-q">질문</th>
          <th class="t-model">모델</th>
          <th class="t-len">답변길이</th>
        </tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>
  <div class="pagination">
    <button class="btn" onclick="loadPage(currentPage - 1)">◀</button>
    <span class="cur" id="pageLabel"></span>
    <button class="btn" onclick="loadPage(currentPage + 1)">▶</button>
  </div>
  <div class="empty" id="emptyEl" style="display:none">기록이 없습니다.</div>
</div>

<script>
let adminKey = '';
let currentPage = 0;
let totalLogs = 0;
let searchTimer = null;

// Enter 키 로그인
document.getElementById('keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function doLogin() {
  const k = document.getElementById('keyInput').value.trim();
  if (!k) return;
  adminKey = k;
  // 키 검증: 실제 API 호출해서 확인
  loadPage(0, true);
}

async function apiFetch(params = {}) {
  const qs = new URLSearchParams({ key: adminKey, ...params });
  const r = await fetch(`/api/admin-logs?${qs}`);
  const data = await r.json();
  if (r.status === 401) throw new Error('auth');
  if (!r.ok) throw new Error(data.error || '오류');
  return data;
}

async function loadPage(page, isLogin = false) {
  if (page < 0) return;
  const q = document.getElementById('searchInput')?.value || '';
  try {
    const params = { page };
    if (q) params.q = q;
    const data = await apiFetch(params);
    if (isLogin) {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('main').style.display = 'block';
    }
    document.getElementById('loginErr').style.display = 'none';
    document.getElementById('errBox').innerHTML = '';
    currentPage = page;
    totalLogs = data.total;
    renderLogs(data.logs, data.total, data.page, data.pageSize);
  } catch (e) {
    if (e.message === 'auth') {
      document.getElementById('loginErr').style.display = 'block';
      document.getElementById('main').style.display = 'none';
      document.getElementById('loginBox').style.display = 'block';
    } else {
      document.getElementById('errBox').innerHTML = `<div class="err">오류: ${e.message}</div>`;
    }
  }
}

function renderLogs(logs, total, page, pageSize) {
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  document.getElementById('statEl').innerHTML = `총 <b>${total}</b>건 · ${page + 1}/${totalPages} 페이지`;
  document.getElementById('pageLabel').textContent = `${page + 1} / ${totalPages}`;

  const body = document.getElementById('logBody');
  if (!logs.length) {
    body.innerHTML = '';
    document.getElementById('emptyEl').style.display = 'block';
    return;
  }
  document.getElementById('emptyEl').style.display = 'none';

  body.innerHTML = logs.map(l => {
    const t = l.t ? new Date(l.t).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', hour12: false }) : '-';
    const q = escHtml(l.q || '').replace(/\n/g, '<br>');
    const model = (l.m || '-').replace('gemini-', '');
    const rl = l.rl ? (l.rl > 999 ? Math.round(l.rl / 100) / 10 + 'k' : l.rl) : '-';
    return `<tr>
      <td class="t-num">${l._idx}</td>
      <td class="t-time">${t}</td>
      <td class="t-q">${q}</td>
      <td class="t-model">${model}</td>
      <td class="t-len">${rl}</td>
    </tr>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function debSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadPage(0), 300);
}

async function clearLogs() {
  if (!confirm('모든 로그를 삭제합니다. 복구할 수 없습니다. 계속하시겠습니까?')) return;
  try {
    await apiFetch({ clear: '1' });
    loadPage(0);
  } catch (e) {
    alert('삭제 실패: ' + e.message);
  }
}
</script>
</body>
</html>
